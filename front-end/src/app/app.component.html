<app-skip-to-content></app-skip-to-content>
<div class="visually-hidden" aria-live="polite" role="status">{{ routeAnnouncement }}</div>
<div class=" text-center" style="background-color: #ffffff;">
  @if (showHeaderAndNavbar) {
    <div  class="col-12 ">
      <app-header></app-header>
    </div>
  }
</div>

<main id="main-content" #mainContent tabindex="-1">
  <router-outlet style="background-color: #f8f8f8;"></router-outlet>
</main>

<app-session-timeout-warning
  [isVisible]="showSessionTimeoutWarning"
  [countdownSeconds]="sessionTimeoutCountdown"
  (stayLoggedIn)="onStayLoggedIn()"
  (logOut)="onSessionTimeoutLogOut()">
</app-session-timeout-warning>

@if (showHeaderAndNavbar) {
  <footer class="container-fluid p-0 text-center">
    <div class="col-12 ">
      <app-footer></app-footer>
    </div>
  </footer>
}
