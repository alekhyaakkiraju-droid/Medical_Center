<section class="video-gallery max-w-screen-xl px-4 mx-auto">
  <div class="container">
    <div class="row">
      <div class="col-md-12">
        <div class="section-title text-center">
          <h3>Collected Media <span>of Our PrimeCare  Center</span></h3>
          <p>
            Discover the latest advancements in medical science, patient care, and healthcare technology
            through our exclusive conferences and symposiums.
          </p>
        </div>
      </div>

      @for (video of videoGallery; track video) {
        <div class="col-sm-6">
          <div class="video-gallery-item">
            <div class="image-holder">
              <img [src]="video.thumbnail | assetUrl" class="img-responsive" alt="video-gallery" />
              <a data-fancybox [href]="video.videoUrl">
                <i class="fa fa-play"></i>
              </a>
            </div>
            <h3>{{ video.title }}</h3>
          </div>
        </div>
      }
    </div>

  </div>
</section>
