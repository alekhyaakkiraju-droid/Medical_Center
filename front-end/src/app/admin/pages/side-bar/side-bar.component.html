<nav class="fixed top-0 z-50 w-full admin-shell-topbar">
  <div class="px-4 py-3 lg:px-6">
    <div class="flex items-center justify-between">
      <a routerLink="/admin/dashboard" class="flex items-center gap-3">
        <img src="images/loggggo-3.png" class="h-9" alt="CareShift Logo" />
        <div>
          <span class="block text-lg font-semibold text-slate-900">CareShift</span>
          <span class="block text-xs text-slate-500">Administration Portal</span>
        </div>
      </a>
      <div class="hidden sm:flex items-center gap-3 rounded-full border border-slate-200 bg-slate-50 px-4 py-2">
        <i class="fa-solid fa-user-shield text-[#48bdc5]" aria-hidden="true"></i>
        <span class="text-sm font-medium text-slate-700">{{ userLabel }}</span>
      </div>
    </div>
  </div>
</nav>

<aside
  id="logo-sidebar"
  class="fixed top-0 left-0 z-40 w-64 h-screen pt-24 admin-shell-sidebar sm:translate-x-0"
  aria-label="Admin sidebar"
>
  <div class="h-full px-3 pb-4 overflow-y-auto">
    <ul class="space-y-1">
      @for (item of menuItems; track item.title) {
        <li>
          @if (isModalItem(item)) {
            <button
              type="button"
              class="admin-nav-link"
              data-bs-toggle="modal"
              [attr.data-bs-target]="item.target"
            >
              <i [class]="item.icon" aria-hidden="true"></i>
              <span>{{ item.title }}</span>
            </button>
          } @else {
            <a
              [routerLink]="item.path"
              routerLinkActive="active"
              class="admin-nav-link"
            >
              <i [class]="item.icon" aria-hidden="true"></i>
              <span class="flex-1">{{ item.title }}</span>
              @if (item.badge) {
                <span class="inline-flex min-w-6 items-center justify-center rounded-full bg-[#48bdc5] px-2 text-xs font-semibold text-white">
                  {{ item.badge }}
                </span>
              }
            </a>
          }
        </li>
      }
    </ul>
  </div>
</aside>

<div class="modal fade" id="logoutModal" tabindex="-1" aria-labelledby="logoutModalLabel" aria-hidden="true">
  <app-logout></app-logout>
</div>
