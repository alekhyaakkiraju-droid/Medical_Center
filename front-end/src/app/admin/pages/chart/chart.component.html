<div class="row mb-4">
  @for (card of cards; track card.id) {
    <div [class]="card.size">
      <div class="admin-chart-card">
        <div class="admin-chart-card__header">{{ card.title }}</div>
        <div class="admin-chart-card__body">
          <div #chartHost [id]="card.id"></div>
        </div>
      </div>
    </div>
  }
</div>
