services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: medical-center-sqlserver
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD}
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  api:
    build:
      context: ./backend/AngularApi
      dockerfile: Dockerfile
    container_name: medical-center-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__connection: Server=sqlserver,1433;Database=MedicalCenter;User Id=sa;Password=${MSSQL_SA_PASSWORD};TrustServerCertificate=True;Encrypt=False
      Jwt__Secret: ${JWT_SECRET}
      Jwt__ValidIssuer: ${JWT_VALID_ISSUER}
      Jwt__ValidAudience: ${JWT_VALID_AUDIENCE}
      GoogleAuth__ClientId: ${GOOGLE_AUTH_CLIENT_ID}
      GoogleAuth__ClientSecret: ${GOOGLE_AUTH_CLIENT_SECRET}
      EmailSettings__EmailUsername: ${SMTP_EMAIL_USERNAME}
      EmailSettings__EmailPassword: ${SMTP_EMAIL_PASSWORD}
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    expose:
      - "8080"

  yarp-proxy:
    build:
      context: ./backend
      dockerfile: YARPReverseProxy/Dockerfile
    container_name: medical-center-yarp
    volumes:
      - ./docker/yarp.config.json:/app/appsettings.json:ro
    ports:
      - "${YARP_HOST_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  angular-frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ${API_PUBLIC_URL:-http://localhost:8080/api}
    container_name: medical-center-frontend
    ports:
      - "${FRONTEND_HOST_PORT:-8081}:80"
    depends_on:
      yarp-proxy:
        condition: service_healthy

volumes:
  sqlserver-data:
