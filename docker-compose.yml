secrets:
  jwt_secret:
    file: ./secrets/jwt_secret
  mssql_sa_password:
    file: ./secrets/mssql_sa_password
  smtp_email_username:
    file: ./secrets/smtp_email_username
  smtp_email_password:
    file: ./secrets/smtp_email_password
  google_auth_client_id:
    file: ./secrets/google_auth_client_id
  google_auth_client_secret:
    file: ./secrets/google_auth_client_secret

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: medical-center-sqlserver
    entrypoint: ["/bin/bash", "/docker/sqlserver-entrypoint.sh"]
    environment:
      ACCEPT_EULA: "Y"
    secrets:
      - mssql_sa_password
    ports:
      - "1433:1433"
    volumes:
      - sqlserver-data:/var/opt/mssql
      - ./docker/sqlserver-entrypoint.sh:/docker/sqlserver-entrypoint.sh:ro
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mailhog:
    image: mailhog/mailhog:latest
    container_name: medical-center-mailhog
    ports:
      - "1025:1025"
      - "8025:8025"

  api:
    build:
      context: ./backend/AngularApi
      dockerfile: Dockerfile
    container_name: medical-center-api
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__connection: Server=sqlserver,1433;Database=MedicalCenter;User Id=sa;TrustServerCertificate=True;Encrypt=False
      Jwt__ValidIssuer: ${JWT_VALID_ISSUER}
      Jwt__ValidAudience: ${JWT_VALID_AUDIENCE}
      CorsSettings__AllowedOrigins__0: ${CORS_ALLOWED_ORIGINS_0:-http://localhost:8081}
      CorsSettings__AllowedOrigins__1: ${CORS_ALLOWED_ORIGINS_1:-http://localhost:4200}
      SmtpSettings__Host: mailhog
      SmtpSettings__Port: 1025
      SmtpSettings__UseTls: "false"
    secrets:
      - jwt_secret
      - mssql_sa_password
      - smtp_email_username
      - smtp_email_password
      - google_auth_client_id
      - google_auth_client_secret
    depends_on:
      sqlserver:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    expose:
      - "8080"

  yarp-proxy:
    build:
      context: ./backend
      dockerfile: YARPReverseProxy/Dockerfile
    container_name: medical-center-yarp
    volumes:
      - ./docker/yarp.config.json:/app/appsettings.json:ro
    ports:
      - "${YARP_HOST_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  angular-frontend:
    build:
      context: ./front-end
      dockerfile: Dockerfile
      args:
        API_BASE_URL: ${API_PUBLIC_URL:-/api}
    container_name: medical-center-frontend
    ports:
      - "${FRONTEND_HOST_PORT:-8081}:80"
    depends_on:
      yarp-proxy:
        condition: service_healthy

volumes:
  sqlserver-data:
