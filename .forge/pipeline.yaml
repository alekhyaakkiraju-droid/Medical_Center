# Forge Shipping pipeline for Medical Center
# Phase 1 (WO-024): CI, security scans, Docker build, staging smoke tests
# Phase 2 (WO-001): ECR push, staging deploy/E2E, IDP production promotion, rollback
name: Medical Center CI/CD
engine: opsera
webhook_enabled: true
webhook_branch: main

triggers:
  push:
    branches: [main]
  pull_request:
    branches: [main]

variables:
  REPO_FULL_NAME:
    value: alekhyaakkiraju-droid/Medical_Center
  DOTNET_VERSION:
    value: "8.0"
  NODE_VERSION:
    value: "22"
  CONTAINER_REGISTRY_URL:
    value: "${CONTAINER_REGISTRY_URL}"
  AWS_REGION:
    value: "${AWS_REGION:-us-east-1}"
  STAGING_BASE_URL:
    value: "${STAGING_BASE_URL}"
  STAGING_API_URL:
    value: "${STAGING_API_URL}"
  PRODUCTION_BASE_URL:
    value: "${PRODUCTION_BASE_URL}"
  PRODUCTION_API_URL:
    value: "${PRODUCTION_API_URL}"
  ECS_STAGING_CLUSTER:
    value: "${ECS_STAGING_CLUSTER}"
  ECS_PRODUCTION_CLUSTER:
    value: "${ECS_PRODUCTION_CLUSTER}"
  ECS_STAGING_API_SERVICE:
    value: "${ECS_STAGING_API_SERVICE:-medical-center-api-staging}"
  ECS_STAGING_YARP_SERVICE:
    value: "${ECS_STAGING_YARP_SERVICE:-medical-center-yarp-staging}"
  ECS_STAGING_FRONTEND_SERVICE:
    value: "${ECS_STAGING_FRONTEND_SERVICE:-medical-center-frontend-staging}"
  ECS_PRODUCTION_API_SERVICE:
    value: "${ECS_PRODUCTION_API_SERVICE:-medical-center-api-production}"
  ECS_PRODUCTION_YARP_SERVICE:
    value: "${ECS_PRODUCTION_YARP_SERVICE:-medical-center-yarp-production}"
  ECS_PRODUCTION_FRONTEND_SERVICE:
    value: "${ECS_PRODUCTION_FRONTEND_SERVICE:-medical-center-frontend-production}"
  IDP_SMTP_HOST:
    value: "${IDP_SMTP_HOST}"
  IDP_SMTP_PORT:
    value: "${IDP_SMTP_PORT:-587}"
  IDP_SMTP_USE_TLS:
    value: "${IDP_SMTP_USE_TLS:-true}"
  IDP_SMTP_USERNAME:
    value: "${IDP_SMTP_USERNAME}"
  IDP_SMTP_PASSWORD:
    value: "${IDP_SMTP_PASSWORD}"
  IDP_SMTP_WEB_URL:
    value: "${IDP_SMTP_WEB_URL}"

steps:
  # --- Security scans (parallel source-level) ---
  - name: Secret Detection
    variantId: scan:gitleaks
    config:
      scanCommand: gitleaks detect --source . --report-format json --no-git
      failOnBreach: fail
      severityThreshold: high

  - name: SAST Scan
    variantId: scan:semgrep
    config:
      scanCommand: semgrep scan --config auto --error --severity ERROR .
      failOnBreach: fail
      severityThreshold: critical

  - name: NPM Dependency Audit
    variantId: test:generic
    config:
      testCommand: cd front-end && npm ci --ignore-scripts && npm audit --audit-level=critical

  # --- Build ---
  - name: Backend Build
    variantId: build:dotnet
    config:
      repoFullName: alekhyaakkiraju-droid/Medical_Center
      branch: main
      dotnetVersion: "8.0"
      buildCommand: dotnet build backend/AngularApi/AngularApi.csproj -c Release

  - name: Frontend Build
    variantId: build:node
    config:
      repoFullName: alekhyaakkiraju-droid/Medical_Center
      branch: main
      nodeVersion: "22"
      buildCommand: cd front-end && npm ci --ignore-scripts && ./node_modules/.bin/ng build --configuration production

  # --- Tests ---
  - name: Backend Unit Tests
    variantId: test:generic
    config:
      testCommand: dotnet test backend/AngularApi.Tests/AngularApi.Tests.csproj -c Release

  - name: Frontend Unit Tests
    variantId: test:generic
    config:
      testCommand: cd front-end && npm ci --ignore-scripts && npm run test -- --watch=false --browsers=ChromeHeadless

  # --- Docker images (all 3 services) ---
  - name: Docker API Image
    variantId: build:docker
    config:
      repoFullName: alekhyaakkiraju-droid/Medical_Center
      branch: main
      dockerfile: backend/AngularApi/Dockerfile
      imageName: medical-center-api

  - name: Docker YARP Image
    variantId: build:docker
    config:
      repoFullName: alekhyaakkiraju-droid/Medical_Center
      branch: main
      dockerfile: backend/YARPReverseProxy/Dockerfile
      imageName: medical-center-yarp

  - name: Docker Frontend Image
    variantId: build:docker
    config:
      repoFullName: alekhyaakkiraju-droid/Medical_Center
      branch: main
      dockerfile: front-end/Dockerfile
      imageName: medical-center-frontend

  - name: Container Vulnerability Scan
    variantId: scan:grype
    config:
      failOnBreach: fail
      severityThreshold: critical

  # --- Registry push (Git SHA + latest) ---
  - name: Push API Image to Registry
    variantId: push:ecr
    config:
      registry: "${CONTAINER_REGISTRY_URL}"
      region: "${AWS_REGION:-us-east-1}"
      imageName: medical-center-api
      tag: "$GIT_SHA"

  - name: Push API Image Latest Tag
    variantId: push:ecr
    config:
      registry: "${CONTAINER_REGISTRY_URL}"
      region: "${AWS_REGION:-us-east-1}"
      imageName: medical-center-api
      tag: latest

  - name: Push YARP Image to Registry
    variantId: push:ecr
    config:
      registry: "${CONTAINER_REGISTRY_URL}"
      region: "${AWS_REGION:-us-east-1}"
      imageName: medical-center-yarp
      tag: "$GIT_SHA"

  - name: Push YARP Image Latest Tag
    variantId: push:ecr
    config:
      registry: "${CONTAINER_REGISTRY_URL}"
      region: "${AWS_REGION:-us-east-1}"
      imageName: medical-center-yarp
      tag: latest

  - name: Push Frontend Image to Registry
    variantId: push:ecr
    config:
      registry: "${CONTAINER_REGISTRY_URL}"
      region: "${AWS_REGION:-us-east-1}"
      imageName: medical-center-frontend
      tag: "$GIT_SHA"

  - name: Push Frontend Image Latest Tag
    variantId: push:ecr
    config:
      registry: "${CONTAINER_REGISTRY_URL}"
      region: "${AWS_REGION:-us-east-1}"
      imageName: medical-center-frontend
      tag: latest

  # --- Staging deploy and verification ---
  - name: Staging Deploy API
    variantId: deploy:aws_ecs
    config:
      repoFullName: alekhyaakkiraju-droid/Medical_Center
      branch: main
      region: "${AWS_REGION:-us-east-1}"
      clusterName: "${ECS_STAGING_CLUSTER}"
      serviceName: "${ECS_STAGING_API_SERVICE}"
      envVars:
        IMAGE_TAG: "$GIT_SHA"
        IMAGE_NAME: medical-center-api
        SmtpSettings__Host: "${IDP_SMTP_HOST}"
        SmtpSettings__Port: "${IDP_SMTP_PORT:-587}"
        SmtpSettings__UseTls: "${IDP_SMTP_USE_TLS:-true}"
        EmailSettings__EmailUsername: "${IDP_SMTP_USERNAME}"
        EmailSettings__EmailPassword: "${IDP_SMTP_PASSWORD}"

  - name: Staging Deploy YARP
    variantId: deploy:aws_ecs
    config:
      repoFullName: alekhyaakkiraju-droid/Medical_Center
      branch: main
      region: "${AWS_REGION:-us-east-1}"
      clusterName: "${ECS_STAGING_CLUSTER}"
      serviceName: "${ECS_STAGING_YARP_SERVICE}"
      envVars:
        IMAGE_TAG: "$GIT_SHA"
        IMAGE_NAME: medical-center-yarp

  - name: Staging Deploy Frontend
    variantId: deploy:aws_ecs
    config:
      repoFullName: alekhyaakkiraju-droid/Medical_Center
      branch: main
      region: "${AWS_REGION:-us-east-1}"
      clusterName: "${ECS_STAGING_CLUSTER}"
      serviceName: "${ECS_STAGING_FRONTEND_SERVICE}"
      envVars:
        IMAGE_TAG: "$GIT_SHA"
        IMAGE_NAME: medical-center-frontend

  - name: Staging Smoke Tests
    variantId: test:generic
    config:
      # WO-031: passing /health confirms API started with IDP SMTP env vars from Staging Deploy API
      # WO-038: expanded image, routerLink navigation, and structured 401 assertions
      testCommand: SMOKE_BASE_URL="${STAGING_BASE_URL}" SMOKE_API_URL="${STAGING_API_URL}" ./scripts/run-e2e-smoke.sh

  - name: Patient Journey E2E
    variantId: test:generic
    config:
      testCommand: SMOKE_API_URL="${STAGING_API_URL}" ./scripts/e2e-patient-journey.sh

  - name: Staging E2E Tests
    variantId: test:generic
    config:
      testCommand: SMOKE_BASE_URL="${STAGING_BASE_URL}" SMOKE_API_URL="${STAGING_API_URL}" ./scripts/run-e2e-smoke.sh

  # --- DAST (OWASP ZAP) — runs against live staging; high+ findings block production promotion ---
  - name: DAST Scan
    variantId: scan:zap
    config:
      zapConfig: .forge/zap-baseline.conf
      scanCommand: docker run --rm -v "$(pwd):/zap/wrk/:rw" ghcr.io/zaproxy/zaproxy:stable zap-baseline.py -t "${STAGING_BASE_URL}" -O "${STAGING_API_URL}/swagger/v1/swagger.json" -c /zap/wrk/.forge/zap-baseline.conf -J zap-dast-report.json -x zap-dast-report.xml -I
      failOnBreach: fail
      severityThreshold: high
      timeoutMinutes: 10
      archiveArtifacts:
        - zap-dast-report.json
        - zap-dast-report.xml

  # --- Production promotion (dual gate: automated tests + IDP manual sign-off) ---
  - name: Production Promotion Gate
    variantId: gate:idp-approval
    config:
      gateType: manual
      requiredApprovers: 1
      description: IDP sign-off required after staging smoke, E2E, and DAST pass

  - name: Production Deploy API
    variantId: deploy:aws_ecs
    config:
      repoFullName: alekhyaakkiraju-droid/Medical_Center
      branch: main
      region: "${AWS_REGION:-us-east-1}"
      clusterName: "${ECS_PRODUCTION_CLUSTER}"
      serviceName: "${ECS_PRODUCTION_API_SERVICE}"
      envVars:
        IMAGE_TAG: "$GIT_SHA"
        IMAGE_NAME: medical-center-api

  - name: Production Deploy YARP
    variantId: deploy:aws_ecs
    config:
      repoFullName: alekhyaakkiraju-droid/Medical_Center
      branch: main
      region: "${AWS_REGION:-us-east-1}"
      clusterName: "${ECS_PRODUCTION_CLUSTER}"
      serviceName: "${ECS_PRODUCTION_YARP_SERVICE}"
      envVars:
        IMAGE_TAG: "$GIT_SHA"
        IMAGE_NAME: medical-center-yarp

  - name: Production Deploy Frontend
    variantId: deploy:aws_ecs
    config:
      repoFullName: alekhyaakkiraju-droid/Medical_Center
      branch: main
      region: "${AWS_REGION:-us-east-1}"
      clusterName: "${ECS_PRODUCTION_CLUSTER}"
      serviceName: "${ECS_PRODUCTION_FRONTEND_SERVICE}"
      envVars:
        IMAGE_TAG: "$GIT_SHA"
        IMAGE_NAME: medical-center-frontend

  - name: Production Post-Deploy Smoke Tests
    variantId: test:generic
    config:
      testCommand: SMOKE_BASE_URL="${PRODUCTION_BASE_URL}" SMOKE_API_URL="${PRODUCTION_API_URL}" ./scripts/smoke-tests.sh

  - name: Production Rollback
    variantId: deploy:aws_ecs
    config:
      repoFullName: alekhyaakkiraju-droid/Medical_Center
      branch: main
      region: "${AWS_REGION:-us-east-1}"
      clusterName: "${ECS_PRODUCTION_CLUSTER}"
      serviceName: "${ECS_PRODUCTION_API_SERVICE}"
      envVars:
        IMAGE_TAG: "$PREVIOUS_GIT_SHA"
        IMAGE_NAME: medical-center-api
        ROLLBACK: "true"

environments:
  dev:
    description: Development — build and test only
    steps:
      - Secret Detection
      - SAST Scan
      - NPM Dependency Audit
      - Backend Build
      - Frontend Build
      - Backend Unit Tests
      - Frontend Unit Tests
  staging:
    description: Staging — full build, scan, registry push, staging deploy, smoke and E2E
    steps:
      - Secret Detection
      - SAST Scan
      - NPM Dependency Audit
      - Backend Build
      - Frontend Build
      - Backend Unit Tests
      - Frontend Unit Tests
      - Docker API Image
      - Docker YARP Image
      - Docker Frontend Image
      - Container Vulnerability Scan
      - Push API Image to Registry
      - Push API Image Latest Tag
      - Push YARP Image to Registry
      - Push YARP Image Latest Tag
      - Push Frontend Image to Registry
      - Push Frontend Image Latest Tag
      - Staging Deploy API
      - Staging Deploy YARP
      - Staging Deploy Frontend
      - Staging Smoke Tests
      - Staging E2E Tests
      - DAST Scan
  production:
    description: Production — IDP-governed promotion, deploy, post-deploy verification, rollback
    steps:
      - Production Promotion Gate
      - Production Deploy API
      - Production Deploy YARP
      - Production Deploy Frontend
      - Production Post-Deploy Smoke Tests
      - Production Rollback
