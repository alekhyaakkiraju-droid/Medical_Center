# OWASP ZAP baseline configuration — Medical Center staging (WO-006)
# Used by the DAST Scan step in .forge/pipeline.yaml after staging smoke/E2E pass.
#
# --- Target URLs (passed via pipeline scanCommand; documented here for reproducibility) ---
# Frontend SPA entry point: ${STAGING_BASE_URL}
# API gateway (YARP):       ${STAGING_API_URL}
# OpenAPI spec for import:  ${STAGING_API_URL}/swagger/v1/swagger.json
#
# --- Scan tuning ---
# Conservative spider delay (ms) to avoid triggering auth rate limits on /api/auth/*
scan.delayMs=250
# Maximum scan duration — matches pipeline timeoutMinutes: 10
scan.maxDurationMinutes=10

# --- Rule exclusions (format: ruleId ACTION # justification) ---
# CSP unsafe-inline — required by Angular zone.js bootstrap; enforced at CDN/edge in production
10055	IGNORE
# Content Security Policy header not set on static assets — nginx serves SPA; CSP applied at ALB/CDN
10038	IGNORE
# X-Frame-Options missing on API ProblemDetails responses — API is not framed; frontend sets frame-ancestors
10020	IGNORE
# Modern Web Application fingerprint — expected for Angular SPA
10109	IGNORE
# Application Error Disclosure — API returns structured ProblemDetails JSON, not stack traces
90022	IGNORE
# Hidden File Found — hash-based SPA routes can trigger false positives on client-side paths
40025	IGNORE
# Cookie without SameSite — refresh token cookie SameSite policy tracked separately (WO-008)
10011	WARN
