apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: medical-center-dev
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/alekhyaakkiraju-droid/Medical_Center.git
    targetRevision: main
    path: .opsera-medical-center/k8s
  destination:
    name: opsera-usw2-np
    namespace: opsera-medical-center-dev
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
