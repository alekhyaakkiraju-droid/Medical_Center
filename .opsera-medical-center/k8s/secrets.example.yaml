# Copy to secrets.yaml, fill values, apply ONCE before first API deploy:
#   kubectl apply -f secrets.yaml -n opsera-medical-center-dev
#
# Do not commit real secrets. Use Forge/AWS Secrets Manager for production.
apiVersion: v1
kind: Secret
metadata:
  name: medical-center-app-secrets
  labels:
    app: medical-center
    tenant: opsera
type: Opaque
stringData:
  connection-string: "Server=YOUR_SQL_HOST,1433;Database=MedicalCenter;User Id=sa;Password=CHANGE_ME;TrustServerCertificate=True;Encrypt=False"
  jwt-secret: "CHANGE_ME_MIN_32_CHARS"
  mssql-sa-password: "CHANGE_ME_STRONG_PASSWORD"
  smtp-email-username: "dev@example.com"
  smtp-email-password: "CHANGE_ME"
  google-auth-client-id: "CHANGE_ME"
  google-auth-client-secret: "CHANGE_ME"
