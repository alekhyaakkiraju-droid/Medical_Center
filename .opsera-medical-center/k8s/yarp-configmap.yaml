apiVersion: v1
kind: ConfigMap
metadata:
  name: medical-center-yarp-config
  labels:
    app: medical-center-yarp
    tenant: opsera
data:
  appsettings.json: |
    {
      "Logging": {
        "LogLevel": {
          "Default": "Information",
          "Microsoft.AspNetCore": "Warning"
        }
      },
      "ReverseProxy": {
        "Routes": {
          "api-health-route": {
            "ClusterId": "api-cluster",
            "Order": 0,
            "Match": {
              "Path": "/api/health"
            },
            "Transforms": [
              { "PathSet": "/health" }
            ]
          },
          "api-route": {
            "ClusterId": "api-cluster",
            "Order": 1,
            "Match": {
              "Path": "/api/{**catch-all}"
            }
          }
        },
        "Clusters": {
          "api-cluster": {
            "Destinations": {
              "api": {
                "Address": "http://medical-center-api:8080"
              }
            }
          }
        }
      }
    }
